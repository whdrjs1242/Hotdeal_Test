# 로컬 개발/셀프호스팅용: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hotdeal
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  app:
    build: .
    profiles: [app]
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/hotdeal
      REDIS_URL: redis://redis:6379
    ports: ["3000:3000"]
    depends_on: [db, redis]
volumes:
  pgdata:
